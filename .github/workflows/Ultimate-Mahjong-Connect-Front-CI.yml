name: Ultimate-Mahjong-Connect-Front CI

on: 
  push:
    branches: [main, develop, feature/*]
  workflow_dispatch: 
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies 
        working-directory: ./ultimate-mahjong-connect
        run: npm ci
      - name: Run tests 
        working-directory: ./ultimate-mahjong-connect
        continue-on-error: true
        run: npm test -- --browsers=ChromeHeadless --watch=false --no-progress
