<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect x="5" y="5" width="90" height="130" rx="5" ry="5" fill="#f0f0e0" stroke="#000" stroke-width="2"/>
  <rect x="10" y="10" width="80" height="120" rx="3" ry="3" fill="none" stroke="#8B4513" stroke-width="0.5" stroke-opacity="0.3"/>
  
  <!-- Spring symbol - Cherry blossom tree -->
  <g transform="translate(50, 75)">
    <!-- Tree trunk and branches -->
    <path d="M 0,30 C 0,20 0,10 0,0
             M 0,0 C -15,-5 -25,-15 -30,-25
             M 0,0 C -5,-10 -5,-20 0,-30
             M 0,0 C 15,-5 25,-15 30,-25"
          fill="none" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Cherry blossoms -->
    <g transform="translate(-30, -25)">
      <circle cx="0" cy="0" r="7" fill="#FFB7C5" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="2" cy="2" r="2" fill="#FFD700"/>
    </g>
    <g transform="translate(-20, -15)">
      <circle cx="0" cy="0" r="6" fill="#FFB7C5" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFD700"/>
    </g>
    <g transform="translate(-10, -25)">
      <circle cx="0" cy="0" r="5" fill="#FFB7C5" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="1" cy="1" r="1.5" fill="#FFD700"/>
    </g>
    <g transform="translate(0, -30)">
      <circle cx="0" cy="0" r="8" fill="#FFB7C5" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="2" cy="2" r="2" fill="#FFD700"/>
    </g>
    <g transform="translate(10, -20)">
      <circle cx="0" cy="0" r="6" fill="#FFB7C5" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFD700"/>
    </g>
    <g transform="translate(25, -25)">
      <circle cx="0" cy="0" r="7" fill="#FFB7C5" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="2" cy="2" r="2" fill="#FFD700"/>
    </g>
    
    <!-- Grass and small flowers at the base -->
    <path d="M -25,30 C -20,25 -15,27 -10,30 
             M -5,30 C 0,25 5,27 10,30
             M 15,30 C 20,25 25,27 30,30"
          fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-22" cy="27" r="2" fill="#FFFF99"/>
    <circle cx="8" cy="27" r="2" fill="#FF99CC"/>
    <circle cx="22" cy="27" r="2" fill="#99CCFF"/>
  </g>
  
  <!-- Chinese character for Spring (春) -->
  <g transform="translate(50, 27) scale(0.35)">
    <path d="M -30,-30 H 30 M 0,-30 V 30 M -30,0 H 30
             M -30,30 H 30 M -20,-20 C -25,-10 -25,10 -20,20
             M 20,-20 C 25,-10 25,10 20,20"
          fill="none" stroke="#228B22" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Season indicator -->
  <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#228B22">Spring</text>
  
  <!-- Small number "6" indicating Seasons = 6 from the enum -->
  <text x="85" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">1</text>
</svg>