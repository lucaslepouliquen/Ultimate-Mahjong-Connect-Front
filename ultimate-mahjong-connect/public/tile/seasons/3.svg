<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect x="5" y="5" width="90" height="130" rx="5" ry="5" fill="#f0f0e0" stroke="#000" stroke-width="2"/>
  <rect x="10" y="10" width="80" height="120" rx="3" ry="3" fill="none" stroke="#8B4513" stroke-width="0.5" stroke-opacity="0.3"/>
  
  <!-- Autumn symbol - Tree with falling leaves -->
  <g transform="translate(50, 75)">
    <!-- Tree trunk and branches -->
    <path d="M 0,30 C 0,20 0,10 0,0
             M 0,0 C -15,-5 -25,-15 -30,-25
             M 0,0 C -5,-10 -5,-20 0,-30
             M 0,0 C 15,-5 25,-15 30,-25"
          fill="none" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Autumn leaves on tree -->
    <path d="M -30,-25 L -25,-20 L -30,-15 L -25,-10 L -30,-5"
          fill="none" stroke="#CD5C5C" stroke-width="1" stroke-linecap="round"/>
    <path d="M -20,-20 L -15,-15 L -20,-10 L -15,-5 L -20,0"
          fill="none" stroke="#FFA500" stroke-width="1" stroke-linecap="round"/>
    <path d="M -10,-25 L -5,-20 L -10,-15 L -5,-10 L -10,-5"
          fill="none" stroke="#A0522D" stroke-width="1" stroke-linecap="round"/>
    <path d="M 0,-30 L 5,-25 L 0,-20 L 5,-15 L 0,-10"
          fill="none" stroke="#CD5C5C" stroke-width="1" stroke-linecap="round"/>
    <path d="M 10,-25 L 15,-20 L 10,-15 L 15,-10 L 10,-5"
          fill="none" stroke="#FFA500" stroke-width="1" stroke-linecap="round"/>
    <path d="M 20,-20 L 25,-15 L 20,-10 L 25,-5 L 20,0"
          fill="none" stroke="#A0522D" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Falling leaves -->
    <g transform="translate(-25, 0)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#CD5C5C"/>
    </g>
    <g transform="translate(-15, 10)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#FFA500"/>
    </g>
    <g transform="translate(-5, 15)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#A0522D"/>
    </g>
    <g transform="translate(10, 5)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#CD5C5C"/>
    </g>
    <g transform="translate(20, 15)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#FFA500"/>
    </g>
    <g transform="translate(30, 0)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#A0522D"/>
    </g>
    
    <!-- Pile of leaves at the base -->
    <path d="M -30,30 C -25,25 -20,28 -15,25 C -10,22 -5,25 0,22 C 5,19 10,22 15,19 C 20,16 25,19 30,30 Z"
          fill="#CD853F" stroke="#A0522D" stroke-width="1"/>
  </g>
  
  <!-- Chinese character for Autumn (秋) -->
  <g transform="translate(50, 27) scale(0.35)">
    <path d="M -30,-30 H 30 M 0,-30 V 30 M -30,0 H 30
             M -20,10 H 20 M -30,30 H 30" 
          fill="none" stroke="#CD5C5C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Season indicator -->
  <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#CD5C5C">Autumn</text>
  
  <!-- Small number "6" indicating Seasons = 6 from the enum -->
  <text x="85" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">6</text>
</svg>