<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect width="100" height="140" rx="5" fill="#f8f3d6" stroke="#d4a762" stroke-width="2"/>
  
  <!-- Chinese character for "eight" (ba) -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" font-family="Arial" font-size="48" fill="#000000" text-anchor="middle" dominant-baseline="middle">八</text>
    <!-- Wan character (10,000) -->
    <text x="0" y="25" font-family="Arial" font-size="16" fill="#cc0000" text-anchor="middle" dominant-baseline="middle">萬</text>
  </g>
  
  <!-- Character -->
  <text x="50" y="120" font-family="Arial" font-size="16" fill="#cc0000" text-anchor="middle">八</text>
</svg>