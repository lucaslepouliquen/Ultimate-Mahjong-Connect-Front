<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect x="5" y="5" width="90" height="130" rx="5" ry="5" fill="#f0f0e0" stroke="#000" stroke-width="2"/>
  
  <!-- Wind symbol - stylized representation of wind/air -->
  <g transform="translate(50, 70) scale(0.8)">
    <!-- Central circular element -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#2c7bb6" stroke-width="5"/>
    
    <!-- Wind streaks/currents -->
    <path d="M -30,-20 C -20,-15 -10,-25 0,-20 C 10,-15 20,-25 30,-20" fill="none" stroke="#2c7bb6" stroke-width="4" stroke-linecap="round"/>
    <path d="M -30,0 C -20,5 -10,-5 0,0 C 10,5 20,-5 30,0" fill="none" stroke="#2c7bb6" stroke-width="4" stroke-linecap="round"/>
    <path d="M -30,20 C -20,25 -10,15 0,20 C 10,25 20,15 30,20" fill="none" stroke="#2c7bb6" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Chinese character for Wind (风) - simplified representation -->
  <g transform="translate(50, 30) scale(0.5)">
    <path d="M -20,-10 H 20 M -10,-10 V 25 M 0,-20 V 25 M 10,-10 V 15 C 10,25 0,25 -10,20" fill="none" stroke="#d62728" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Small number "3" indicating Winds = 3 from the enum -->
  <text x="85" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">2</text>
</svg>