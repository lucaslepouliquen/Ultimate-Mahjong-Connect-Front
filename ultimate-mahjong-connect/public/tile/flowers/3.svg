<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect x="5" y="5" width="90" height="130" rx="5" ry="5" fill="#f0f0e0" stroke="#000" stroke-width="2"/>
  <rect x="10" y="10" width="80" height="120" rx="3" ry="3" fill="none" stroke="#8B4513" stroke-width="0.5" stroke-opacity="0.3"/>
  
  <!-- Chrysanthemum -->
  <g transform="translate(50, 75)">
    <!-- Stem and leaves -->
    <path d="M 0,30 C 0,20 0,10 0,0"
          fill="none" stroke="#228B22" stroke-width="3" stroke-linecap="round"/>
    
    <path d="M 0,20 C -8,15 -12,20 -15,15"
          fill="none" stroke="#228B22" stroke-width="2" stroke-linecap="round"/>
    
    <path d="M 0,20 C 8,15 12,20 15,15"
          fill="none" stroke="#228B22" stroke-width="2" stroke-linecap="round"/>
    
    <path d="M 0,10 C -10,8 -15,10 -20,5"
          fill="none" stroke="#228B22" stroke-width="2" stroke-linecap="round"/>
    
    <path d="M 0,10 C 10,8 15,10 20,5"
          fill="none" stroke="#228B22" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Flower -->
    <g transform="translate(0, 0)">
      <!-- Outer petals -->
      <path d="M 0,-25 C 5,-20 5,-15 0,-10 C -5,-15 -5,-20 0,-25 Z" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
      <path d="M 17.7,-17.7 C 20,-10 15,-5 10,0 C 5,-5 10,-10 17.7,-17.7 Z" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
      <path d="M 25,0 C 20,5 15,5 10,0 C 15,-5 20,-5 25,0 Z" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
      <path d="M 17.7,17.7 C 10,20 5,15 0,10 C 5,5 10,10 17.7,17.7 Z" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
      <path d="M 0,25 C -5,20 -5,15 0,10 C 5,15 5,20 0,25 Z" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
      <path d="M -17.7,17.7 C -20,10 -15,5 -10,0 C -5,5 -10,10 -17.7,17.7 Z" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
      <path d="M -25,0 C -20,-5 -15,-5 -10,0 C -15,5 -20,5 -25,0 Z" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
      <path d="M -17.7,-17.7 C -10,-20 -5,-15 0,-10 C -5,-5 -10,-10 -17.7,-17.7 Z" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
      
      <!-- Middle petals -->
      <path d="M 0,-18 C 3,-15 3,-12 0,-9 C -3,-12 -3,-15 0,-18 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
      <path d="M 12.7,-12.7 C 15,-8 12,-6 9,-3 C 6,-6 9,-8 12.7,-12.7 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
      <path d="M 18,0 C 15,3 12,3 9,0 C 12,-3 15,-3 18,0 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
      <path d="M 12.7,12.7 C 8,15 6,12 3,9 C 6,6 8,9 12.7,12.7 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
      <path d="M 0,18 C -3,15 -3,12 0,9 C 3,12 3,15 0,18 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
      <path d="M -12.7,12.7 C -15,8 -12,6 -9,3 C -6,6 -9,8 -12.7,12.7 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
      <path d="M -18,0 C -15,-3 -12,-3 -9,0 C -12,3 -15,3 -18,0 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
      <path d="M -12.7,-12.7 C -8,-15 -6,-12 -3,-9 C -6,-6 -8,-9 -12.7,-12.7 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
      
      <!-- Center -->
      <circle cx="0" cy="0" r="9" fill="#FF8C00" stroke="#FF4500" stroke-width="1"/>
      <circle cx="0" cy="0" r="6" fill="#FF4500" stroke="#8B0000" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Chinese character for Chrysanthemum (菊) -->
  <g transform="translate(50, 27) scale(0.35)">
    <path d="M -30,-30 H 30 M 0,-30 V 30 M -30,0 H 30
             M -30,30 H 30 M -20,-15 L 20,15 M -20,15 L 20,-15"
          fill="none" stroke="#FF8C00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Flower name -->
  <text x="15" y="30" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FF8C00">Chrysanthemum</text>
  
  <!-- Small number "5" indicating Flowers = 5 from the enum -->
  <text x="85" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">5</text>
</svg>