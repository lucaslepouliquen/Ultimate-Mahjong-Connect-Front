<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect x="5" y="5" width="90" height="130" rx="5" ry="5" fill="#f0f0e0" stroke="#000" stroke-width="2"/>
  <rect x="10" y="10" width="80" height="120" rx="3" ry="3" fill="none" stroke="#8B4513" stroke-width="0.5" stroke-opacity="0.3"/>
  
  <!-- Plum Blossom -->
  <g transform="translate(50, 75)">
    <!-- Branch -->
    <path d="M -30,20 C -20,10 -10,0 0,-10 C 10,-20 20,-10 25,0"
          fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Flowers -->
    <g transform="translate(-25, 15)">
      <path d="M 0,0 L 4,-4 L 0,-8 L -4,-4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 4,4 L 0,8 L -4,4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -8,0 L -4,-4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -8,0 L -4,4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 8,0 L 4,-4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 8,0 L 4,4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#FFD700"/>
    </g>
    
    <g transform="translate(-15, 0)">
      <path d="M 0,0 L 3,-3 L 0,-6 L -3,-3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 3,3 L 0,6 L -3,3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -6,0 L -3,-3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -6,0 L -3,3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 6,0 L 3,-3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 6,0 L 3,3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFD700"/>
    </g>
    
    <g transform="translate(0, -10)">
      <path d="M 0,0 L 4,-4 L 0,-8 L -4,-4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 4,4 L 0,8 L -4,4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -8,0 L -4,-4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -8,0 L -4,4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 8,0 L 4,-4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 8,0 L 4,4 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#FFD700"/>
    </g>
    
    <g transform="translate(15, 0)">
      <path d="M 0,0 L 3,-3 L 0,-6 L -3,-3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 3,3 L 0,6 L -3,3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -6,0 L -3,-3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -6,0 L -3,3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 6,0 L 3,-3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 6,0 L 3,3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFD700"/>
    </g>
    
    <g transform="translate(25, 10)">
      <path d="M 0,0 L 3,-3 L 0,-6 L -3,-3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 3,3 L 0,6 L -3,3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -6,0 L -3,-3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L -6,0 L -3,3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 6,0 L 3,-3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <path d="M 0,0 L 6,0 L 3,3 Z" fill="#FFC0CB" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFD700"/>
    </g>
  </g>
  
  <!-- Chinese character for Plum Blossom (梅) -->
  <g transform="translate(50, 27) scale(0.35)">
    <path d="M -30,-30 H 30 M 0,-30 V 30 M -30,0 H 30
             M -25,15 H 25 M -30,30 H 30"
          fill="none" stroke="#FF69B4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Flower name -->
  <text x="15" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FF69B4">Plum</text>
  
  <!-- Small number "5" indicating Flowers = 5 from the enum -->
  <text x="85" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">5</text>
</svg>