<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect x="5" y="5" width="90" height="130" rx="5" ry="5" fill="#f0f0e0" stroke="#000" stroke-width="2"/>
  <rect x="10" y="10" width="80" height="120" rx="3" ry="3" fill="none" stroke="#8B4513" stroke-width="0.5" stroke-opacity="0.3"/>
  
  <!-- Bamboo -->
  <g transform="translate(50, 75)">
    <!-- Main bamboo stalk -->
    <rect x="-6" y="-35" width="12" height="8" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
    <rect x="-6" y="-27" width="12" height="12" rx="1" ry="1" fill="#32CD32" stroke="#006400" stroke-width="1"/>
    <rect x="-6" y="-15" width="12" height="8" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
    <rect x="-6" y="-7" width="12" height="12" rx="1" ry="1" fill="#32CD32" stroke="#006400" stroke-width="1"/>
    <rect x="-6" y="5" width="12" height="8" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
    <rect x="-6" y="13" width="12" height="12" rx="1" ry="1" fill="#32CD32" stroke="#006400" stroke-width="1"/>
    <rect x="-6" y="25" width="12" height="10" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
    
    <!-- Left bamboo stalk -->
    <g transform="translate(-20, 0) rotate(-15)">
      <rect x="-4" y="-30" width="8" height="6" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="-24" width="8" height="10" rx="1" ry="1" fill="#32CD32" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="-14" width="8" height="6" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="-8" width="8" height="10" rx="1" ry="1" fill="#32CD32" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="2" width="8" height="6" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="8" width="8" height="10" rx="1" ry="1" fill="#32CD32" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="18" width="8" height="8" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
    </g>
    
    <!-- Right bamboo stalk -->
    <g transform="translate(20, 0) rotate(15)">
      <rect x="-4" y="-30" width="8" height="6" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="-24" width="8" height="10" rx="1" ry="1" fill="#32CD32" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="-14" width="8" height="6" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="-8" width="8" height="10" rx="1" ry="1" fill="#32CD32" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="2" width="8" height="6" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="8" width="8" height="10" rx="1" ry="1" fill="#32CD32" stroke="#006400" stroke-width="1"/>
      <rect x="-4" y="18" width="8" height="8" rx="1" ry="1" fill="#228B22" stroke="#006400" stroke-width="1"/>
    </g>
    
    <!-- Bamboo leaves -->
    <path d="M -6,-35 C -15,-40 -20,-35 -15,-30" fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 6,-35 C 15,-40 20,-35 15,-30" fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -6,-15 C -12,-18 -18,-15 -15,-10" fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 6,-15 C 12,-18 18,-15 15,-10" fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -6,5 C -10,0 -15,5 -12,10" fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 6,5 C 10,0 15,5 12,10" fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -15,-30 C -18,-25 -15,-20 -10,-22" fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 15,-30 C 18,-25 15,-20 10,-22" fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Chinese character for Bamboo (竹) -->
  <g transform="translate(50, 27) scale(0.35)">
    <path d="M -30,-30 H 30 M 0,-30 V 30 M -20,-10 H 20
             M -20,10 H 20 M -30,30 H 30"
          fill="none" stroke="#228B22" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Flower name -->
  <text x="15" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#228B22">Bamboo</text>
  
  <!-- Small number "5" indicating Flowers = 5 from the enum -->
  <text x="85" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">5</text>
</svg>