<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour la tige de bambou -->
    <linearGradient id="bambooStalk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5a2d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a7736;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a2d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour les nœuds du bambou -->
    <linearGradient id="bambooNode" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a4d1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#115324;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4d1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour les feuilles -->
    <radialGradient id="leafGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6bbf6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </radialGradient>
    
    <!-- Filtre d'ombre pour la tige -->
    <filter id="bambooShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Bambou avec effets améliorés -->
  <g transform="translate(50, 70)" filter="url(#bambooShadow)">
    <!-- Tige principale avec dégradé -->
    <rect x="-4" y="-30" width="8" height="60" rx="4" fill="url(#bambooStalk)"/>
    
    <!-- Nœuds du bambou avec dégradé -->
    <rect x="-6" y="-25" width="12" height="2" rx="1" fill="url(#bambooNode)"/>
    <rect x="-6" y="-15" width="12" height="2" rx="1" fill="url(#bambooNode)"/>
    <rect x="-6" y="-5" width="12" height="2" rx="1" fill="url(#bambooNode)"/>
    <rect x="-6" y="5" width="12" height="2" rx="1" fill="url(#bambooNode)"/>
    <rect x="-6" y="15" width="12" height="2" rx="1" fill="url(#bambooNode)"/>
    <rect x="-6" y="25" width="12" height="2" rx="1" fill="url(#bambooNode)"/>
    
    <!-- Feuilles avec dégradé -->
    <path d="M0,-30 C-15,-40 -15,-20 0,-25 C15,-40 15,-20 0,-25" fill="url(#leafGradient)"/>
    
    <!-- Reflet lumineux sur la tige -->
    <rect x="-2" y="-28" width="2" height="56" rx="1" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Caractère avec ombre -->
  <text x="50" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#cc0000" text-anchor="middle" filter="url(#tileShadow)">一</text>
</svg>
