<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect width="100" height="140" rx="5" fill="#f8f3d6" stroke="#d4a762" stroke-width="2"/>
  
  <!-- Three circles in a diagonal line -->
  <!-- Top circle (blue) -->
  <circle cx="30" cy="35" r="12" fill="#0d47a1"/>
  <circle cx="30" cy="35" r="9" fill="#2196f3"/>
  <circle cx="30" cy="35" r="5" fill="#0d47a1"/>
  
  <!-- Middle circle (red) -->
  <circle cx="50" cy="65" r="12" fill="#cc0000"/>
  <circle cx="50" cy="65" r="9" fill="#ff3333"/>
  <circle cx="50" cy="65" r="5" fill="#cc0000"/>
  
  <!-- Bottom circle (green) -->
  <circle cx="70" cy="95" r="12" fill="#1a7736"/>
  <circle cx="70" cy="95" r="9" fill="#4caf50"/>
  <circle cx="70" cy="95" r="5" fill="#1a7736"/>
  
  <!-- Character -->
  <text x="50" y="120" font-family="Arial" font-size="16" fill="#cc0000" text-anchor="middle">三</text>
</svg>