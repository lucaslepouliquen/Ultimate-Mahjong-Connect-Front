<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le cercle principal -->
    <radialGradient id="circleGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cc0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour le cercle intérieur -->
    <radialGradient id="innerCircleGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#ff9999;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff3333;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour le centre -->
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Filtre d'ombre pour le cercle -->
    <filter id="circleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Cercle principal avec dégradé et ombre -->
  <circle cx="50" cy="70" r="25" fill="url(#circleGradient)" filter="url(#circleShadow)"/>
  
  <!-- Cercle intérieur avec dégradé -->
  <circle cx="50" cy="70" r="18" fill="url(#innerCircleGradient)"/>
  
  <!-- Centre avec dégradé -->
  <circle cx="50" cy="70" r="12" fill="url(#centerGradient)"/>
  
  <!-- Reflet lumineux -->
  <circle cx="45" cy="65" r="8" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Caractère avec ombre -->
  <text x="50" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#cc0000" text-anchor="middle" filter="url(#tileShadow)">一</text>
</svg>