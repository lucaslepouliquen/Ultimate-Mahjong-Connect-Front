<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le cercle vert -->
    <radialGradient id="greenCircleGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#6bbf6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a7736;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d4d1a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour le cercle vert intérieur -->
    <radialGradient id="greenInnerGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#8bc34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour le cercle bleu -->
    <radialGradient id="blueCircleGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2e5a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour le cercle bleu intérieur -->
    <radialGradient id="blueInnerGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#90caf9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </radialGradient>
    
    <!-- Filtre d'ombre pour les cercles -->
    <filter id="circleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Deux cercles arrangés diagonalement -->
  <!-- Cercle supérieur (vert) avec dégradé et ombre -->
  <circle cx="35" cy="45" r="15" fill="url(#greenCircleGradient)" filter="url(#circleShadow)"/>
  <circle cx="35" cy="45" r="11" fill="url(#greenInnerGradient)"/>
  <circle cx="35" cy="45" r="7" fill="url(#greenCircleGradient)"/>
  <circle cx="32" cy="42" r="5" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Cercle inférieur (bleu) avec dégradé et ombre -->
  <circle cx="65" cy="85" r="15" fill="url(#blueCircleGradient)" filter="url(#circleShadow)"/>
  <circle cx="65" cy="85" r="11" fill="url(#blueInnerGradient)"/>
  <circle cx="65" cy="85" r="7" fill="url(#blueCircleGradient)"/>
  <circle cx="62" cy="82" r="5" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Caractère avec ombre -->
  <text x="50" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#cc0000" text-anchor="middle" filter="url(#tileShadow)">二</text>
</svg>