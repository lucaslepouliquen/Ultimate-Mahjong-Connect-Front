<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect width="100" height="140" rx="5" fill="#f8f3d6" stroke="#d4a762" stroke-width="2"/>
  
  <!-- Two circles arranged diagonally -->
  <!-- Top circle (green) -->
  <circle cx="35" cy="45" r="15" fill="#1a7736"/>
  <circle cx="35" cy="45" r="11" fill="#4caf50"/>
  <circle cx="35" cy="45" r="7" fill="#1a7736"/>
  
  <!-- Bottom circle (blue) -->
  <circle cx="65" cy="85" r="15" fill="#0d47a1"/>
  <circle cx="65" cy="85" r="11" fill="#2196f3"/>
  <circle cx="65" cy="85" r="7" fill="#0d47a1"/>
  
  <!-- Character -->
  <text x="50" y="120" font-family="Arial" font-size="16" fill="#cc0000" text-anchor="middle">二</text>
