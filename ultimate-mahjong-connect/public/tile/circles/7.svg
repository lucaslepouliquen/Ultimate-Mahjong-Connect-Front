<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect width="100" height="140" rx="5" fill="#f8f3d6" stroke="#d4a762" stroke-width="2"/>
  
  <!-- Seven circles - 3 top, 1 middle, 3 bottom -->
  <!-- Top row -->
  <!-- Top left (green) -->
  <circle cx="25" cy="30" r="10" fill="#1a7736"/>
  <circle cx="25" cy="30" r="7" fill="#4caf50"/>
  <circle cx="25" cy="30" r="4" fill="#1a7736"/>
  
  <!-- Top middle (red) -->
  <circle cx="50" cy="30" r="10" fill="#cc0000"/>
  <circle cx="50" cy="30" r="7" fill="#ff3333"/>
  <circle cx="50" cy="30" r="4" fill="#cc0000"/>
  
  <!-- Top right (green) -->
  <circle cx="75" cy="30" r="10" fill="#1a7736"/>
  <circle cx="75" cy="30" r="7" fill="#4caf50"/>
  <circle cx="75" cy="30" r="4" fill="#1a7736"/>
  
  <!-- Middle (blue) -->
  <circle cx="50" cy="65" r="10" fill="#0d47a1"/>
  <circle cx="50" cy="65" r="7" fill="#2196f3"/>
  <circle cx="50" cy="65" r="4" fill="#0d47a1"/>
  
  <!-- Bottom row -->
  <!-- Bottom left (blue) -->
  <circle cx="25" cy="100" r="10" fill="#0d47a1"/>
  <circle cx="25" cy="100" r="7" fill="#2196f3"/>
  <circle cx="25" cy="100" r="4" fill="#0d47a1"/>
  
  <!-- Bottom middle (green) -->
  <circle cx="50" cy="100" r="10" fill="#1a7736"/>
  <circle cx="50" cy="100" r="7" fill="#4caf50"/>
  <circle cx="50" cy="100" r="4" fill="#1a7736"/>
  
  <!-- Bottom right (blue) -->
  <circle cx="75" cy="100" r="10" fill="#0d47a1"/>
  <circle cx="75" cy="100" r="7" fill="#2196f3"/>
  <circle cx="75" cy="100" r="4" fill="#0d47a1"/>
  
  <!-- Character -->
  <text x="50" y="120" font-family="Arial" font-size="16" fill="#cc0000" text-anchor="middle">七</text>
</svg>