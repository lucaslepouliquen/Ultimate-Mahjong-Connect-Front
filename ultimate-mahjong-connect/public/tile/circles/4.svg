<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect width="100" height="140" rx="5" fill="#f8f3d6" stroke="#d4a762" stroke-width="2"/>
  
  <!-- Four circles in corners -->
  <!-- Top left (blue) -->
  <circle cx="30" cy="40" r="12" fill="#0d47a1"/>
  <circle cx="30" cy="40" r="9" fill="#2196f3"/>
  <circle cx="30" cy="40" r="5" fill="#0d47a1"/>
  
  <!-- Top right (green) -->
  <circle cx="70" cy="40" r="12" fill="#1a7736"/>
  <circle cx="70" cy="40" r="9" fill="#4caf50"/>
  <circle cx="70" cy="40" r="5" fill="#1a7736"/>
  
  <!-- Bottom left (green) -->
  <circle cx="30" cy="90" r="12" fill="#1a7736"/>
  <circle cx="30" cy="90" r="9" fill="#4caf50"/>
  <circle cx="30" cy="90" r="5" fill="#1a7736"/>
  
  <!-- Bottom right (blue) -->
  <circle cx="70" cy="90" r="12" fill="#0d47a1"/>
  <circle cx="70" cy="90" r="9" fill="#2196f3"/>
  <circle cx="70" cy="90" r="5" fill="#0d47a1"/>
  
  <!-- Character -->
  <text x="50" y="120" font-family="Arial" font-size="16" fill="#cc0000" text-anchor="middle">四</text>
</svg>