<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect width="100" height="140" rx="5" fill="#f8f3d6" stroke="#d4a762" stroke-width="2"/>
  
  <!-- Six circles in two columns -->
  <!-- Left column -->
  <!-- Top left (green) -->
  <circle cx="30" cy="35" r="10" fill="#1a7736"/>
  <circle cx="30" cy="35" r="7" fill="#4caf50"/>
  <circle cx="30" cy="35" r="4" fill="#1a7736"/>
  
  <!-- Middle left (green) -->
  <circle cx="30" cy="65" r="10" fill="#1a7736"/>
  <circle cx="30" cy="65" r="7" fill="#4caf50"/>
  <circle cx="30" cy="65" r="4" fill="#1a7736"/>
  
  <!-- Bottom left (green) -->
  <circle cx="30" cy="95" r="10" fill="#1a7736"/>
  <circle cx="30" cy="95" r="7" fill="#4caf50"/>
  <circle cx="30" cy="95" r="4" fill="#1a7736"/>
  
  <!-- Right column -->
  <!-- Top right (blue) -->
  <circle cx="70" cy="35" r="10" fill="#0d47a1"/>
  <circle cx="70" cy="35" r="7" fill="#2196f3"/>
  <circle cx="70" cy="35" r="4" fill="#0d47a1"/>
  
  <!-- Middle right (blue) -->
  <circle cx="70" cy="65" r="10" fill="#0d47a1"/>
  <circle cx="70" cy="65" r="7" fill="#2196f3"/>
  <circle cx="70" cy="65" r="4" fill="#0d47a1"/>
  
  <!-- Bottom right (blue) -->
  <circle cx="70" cy="95" r="10" fill="#0d47a1"/>
  <circle cx="70" cy="95" r="7" fill="#2196f3"/>
  <circle cx="70" cy="95" r="4" fill="#0d47a1"/>
  
  <!-- Character -->
  <text x="50" y="120" font-family="Arial" font-size="16" fill="#cc0000" text-anchor="middle">六</text>
</svg>