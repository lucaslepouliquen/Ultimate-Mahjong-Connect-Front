<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Tile background -->
  <rect width="100" height="140" rx="5" fill="#f8f3d6" stroke="#d4a762" stroke-width="2"/>
  
  <!-- Nine circles in 3x3 grid -->
  <!-- Top row -->
  <circle cx="25" cy="30" r="9" fill="#0d47a1"/>
  <circle cx="25" cy="30" r="6" fill="#2196f3"/>
  <circle cx="25" cy="30" r="3" fill="#0d47a1"/>
  
  <circle cx="50" cy="30" r="9" fill="#1a7736"/>
  <circle cx="50" cy="30" r="6" fill="#4caf50"/>
  <circle cx="50" cy="30" r="3" fill="#1a7736"/>
  
  <circle cx="75" cy="30" r="9" fill="#0d47a1"/>
  <circle cx="75" cy="30" r="6" fill="#2196f3"/>
  <circle cx="75" cy="30" r="3" fill="#0d47a1"/>
  
  <!-- Middle row -->
  <circle cx="25" cy="65" r="9" fill="#1a7736"/>
  <circle cx="25" cy="65" r="6" fill="#4caf50"/>
  <circle cx="25" cy="65" r="3" fill="#1a7736"/>
  
  <circle cx="50" cy="65" r="9" fill="#cc0000"/>
  <circle cx="50" cy="65" r="6" fill="#ff3333"/>
  <circle cx="50" cy="65" r="3" fill="#cc0000"/>
  
  <circle cx="75" cy="65" r="9" fill="#1a7736"/>
  <circle cx="75" cy="65" r="6" fill="#4caf50"/>
  <circle cx="75" cy="65" r="3" fill="#1a7736"/>
  
  <!-- Bottom row -->
  <circle cx="25" cy="100" r="9" fill="#0d47a1"/>
  <circle cx="25" cy="100" r="6" fill="#2196f3"/>
  <circle cx="25" cy="100" r="3" fill="#0d47a1"/>
  
  <circle cx="50" cy="100" r="9" fill="#1a7736"/>
  <circle cx="50" cy="100" r="6" fill="#4caf50"/>
  <circle cx="50" cy="100" r="3" fill="#1a7736"/>
  
  <circle cx="75" cy="100" r="9" fill="#0d47a1"/>
  <circle cx="75" cy="100" r="6" fill="#2196f3"/>
  <circle cx="75" cy="100" r="3" fill="#0d47a1"/>
  
  <!-- Character -->
  <text x="50" y="120" font-family="Arial" font-size="16" fill="#cc0000" text-anchor="middle">九</text>
