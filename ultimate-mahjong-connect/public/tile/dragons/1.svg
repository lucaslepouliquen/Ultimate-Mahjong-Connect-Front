<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le corps du dragon -->
    <linearGradient id="dragonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d62728;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour la tête du dragon -->
    <radialGradient id="dragonHead" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff9999;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d62728;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour les écailles -->
    <radialGradient id="scaleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour la queue enflammée -->
    <radialGradient id="flameGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Filtre d'ombre pour le dragon -->
    <filter id="dragonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Dragon symbol - Eastern style dragon, fully contained within tile -->
  <g transform="translate(50, 75) scale(0.4)" filter="url(#dragonShadow)">
    <!-- Dragon body - sinuous curve with gradient -->
    <path d="M -40,0 
             C -30,-10 -20,-15 -10,-5 
             C 0,5 10,15 20,5 
             C 30,-5 40,-15 50,-5
             C 60,5 70,15 80,5"
          fill="none" stroke="url(#dragonBody)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dragon head with gradient -->
    <path d="M -40,0
             C -45,-5 -50,-5 -55,0
             C -57,2 -58,5 -55,8
             C -52,10 -48,10 -45,8
             C -42,6 -40,3 -40,0 Z"
          fill="url(#dragonHead)" stroke="#9d0208" stroke-width="3"/>
    
    <!-- Dragon horns -->
    <path d="M -55,0 C -60,-5 -62,-10 -58,-15" 
          fill="none" stroke="#9d0208" stroke-width="3" stroke-linecap="round"/>
    <path d="M -55,0 C -62,-2 -65,-5 -63,-12" 
          fill="none" stroke="#9d0208" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Dragon eyes -->
    <circle cx="-50" cy="4" r="3" fill="#000"/>
    <circle cx="-50" cy="4" r="1" fill="#fff"/>
    
    <!-- Dragon scales along body with gradient -->
    <path d="M -30,-10 C -32,-7 -28,-4 -25,-7" fill="url(#scaleGradient)" stroke="#9d0208" stroke-width="1.5"/>
    <path d="M -15,-10 C -17,-7 -13,-4 -10,-7" fill="url(#scaleGradient)" stroke="#9d0208" stroke-width="1.5"/>
    <path d="M 0,2 C -2,5 2,8 5,5" fill="url(#scaleGradient)" stroke="#9d0208" stroke-width="1.5"/>
    <path d="M 15,12 C 13,15 17,18 20,15" fill="url(#scaleGradient)" stroke="#9d0208" stroke-width="1.5"/>
    <path d="M 30,0 C 28,3 32,6 35,3" fill="url(#scaleGradient)" stroke="#9d0208" stroke-width="1.5"/>
    <path d="M 45,-10 C 43,-7 47,-4 50,-7" fill="url(#scaleGradient)" stroke="#9d0208" stroke-width="1.5"/>
    <path d="M 60,0 C 58,3 62,6 65,3" fill="url(#scaleGradient)" stroke="#9d0208" stroke-width="1.5"/>
    <path d="M 75,12 C 73,15 77,18 80,15" fill="url(#scaleGradient)" stroke="#9d0208" stroke-width="1.5"/>
    
    <!-- Dragon whiskers -->
    <path d="M -45,5 C -50,10 -55,8 -60,5 M -45,5 C -50,0 -55,2 -60,5" 
          fill="none" stroke="#9d0208" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Dragon claws/feet -->
    <path d="M -10,-5 C -12,-10 -15,-13 -20,-12 M -10,-5 C -8,-10 -5,-13 0,-12" 
          fill="none" stroke="#9d0208" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50,-5 C 48,-10 45,-13 40,-12 M 50,-5 C 52,-10 55,-13 60,-12" 
          fill="none" stroke="#9d0208" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Dragon tail with flame gradient -->
    <path d="M 80,5 C 85,0 90,5 95,0 C 100,-5 105,0 100,5 C 95,10 90,5 85,10 C 80,15 77,10 80,5 Z" 
          fill="url(#flameGradient)" stroke="#FF4500" stroke-width="1.5"/>
    <path d="M 85,5 C 90,0 95,5 90,7 C 85,10 80,5 85,5 Z" 
          fill="#FF4500" stroke="none"/>
  </g>
  
  <!-- Stylized Chinese character for Dragon with gradient -->
  <g transform="translate(50, 30) scale(0.35)">
    <path d="M -30,-25 H 30 M -20,-25 V -15 H 20 V -25 
             M 0,-15 V 25 M -30,0 H 30 M -30,25 H 30
             M -15,-15 C -25,-5 -25,15 -15,25
             M 15,-15 C 25,-5 25,15 15,25" 
          fill="none" stroke="url(#dragonBody)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Background design elements: cloud pattern -->
  <path d="M 20,45 C 25,40 30,40 35,45" 
        fill="none" stroke="#d62728" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M 65,45 C 70,40 75,40 80,45" 
        fill="none" stroke="#d62728" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M 20,105 C 25,100 30,100 35,105" 
        fill="none" stroke="#d62728" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M 65,105 C 70,100 75,100 80,105" 
        fill="none" stroke="#d62728" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>
  
  <!-- Small number "1" indicating Dragon 1 -->
  <text x="85" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" filter="url(#tileShadow)">1</text>
</svg>