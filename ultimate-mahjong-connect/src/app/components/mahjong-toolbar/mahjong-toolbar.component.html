<mat-toolbar color="accent">
    <div class="toolbar-start">
      <button mat-icon-button class="example-icon" aria-label="Example icon-button with menu icon" (click)="onMenuClick()">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
    
    <div class="toolbar-center">
      <h1>{{title}}</h1>
    </div>
    
    <div class="toolbar-end">
      <button mat-icon-button class="example-icon favorite-icon" aria-label="Example icon-button with heart icon" (click)="onFavoriteClick()">
        <mat-icon>favorite</mat-icon>
      </button>
      <button mat-icon-button class="example-icon" aria-label="Example icon-button with share icon" (click)="onShareClick()">
        <mat-icon>share</mat-icon>
      </button>
    </div>
</mat-toolbar>
