<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour les caractères -->
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour la fleur -->
    <radialGradient id="flowerGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </radialGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Fleur stylisée -->
  <g transform="translate(50, 70) scale(0.8)">
    <!-- Centre de la fleur -->
    <circle cx="0" cy="0" r="8" fill="url(#flowerGradient)" filter="url(#elementShadow)"/>
    <circle cx="0" cy="0" r="6" fill="#228B22"/>
    <circle cx="0" cy="0" r="3" fill="#FFD700"/>
    
    <!-- Pétales -->
    <g>
      <!-- Pétale supérieur -->
      <ellipse cx="0" cy="-15" rx="6" ry="12" fill="url(#flowerGradient)" filter="url(#elementShadow)"/>
      <ellipse cx="0" cy="-15" rx="4" ry="8" fill="#228B22"/>
      
      <!-- Pétale inférieur -->
      <ellipse cx="0" cy="15" rx="6" ry="12" fill="url(#flowerGradient)" filter="url(#elementShadow)"/>
      <ellipse cx="0" cy="15" rx="4" ry="8" fill="#228B22"/>
      
      <!-- Pétale gauche -->
      <ellipse cx="-15" cy="0" rx="12" ry="6" fill="url(#flowerGradient)" filter="url(#elementShadow)"/>
      <ellipse cx="-15" cy="0" rx="8" ry="4" fill="#228B22"/>
      
      <!-- Pétale droit -->
      <ellipse cx="15" cy="0" rx="12" ry="6" fill="url(#flowerGradient)" filter="url(#elementShadow)"/>
      <ellipse cx="15" cy="0" rx="8" ry="4" fill="#228B22"/>
      
      <!-- Pétales diagonaux -->
      <ellipse cx="-10" cy="-10" rx="8" ry="8" fill="url(#flowerGradient)" filter="url(#elementShadow)"/>
      <ellipse cx="-10" cy="-10" rx="5" ry="5" fill="#228B22"/>
      
      <ellipse cx="10" cy="-10" rx="8" ry="8" fill="url(#flowerGradient)" filter="url(#elementShadow)"/>
      <ellipse cx="10" cy="-10" rx="5" ry="5" fill="#228B22"/>
      
      <ellipse cx="-10" cy="10" rx="8" ry="8" fill="url(#flowerGradient)" filter="url(#elementShadow)"/>
      <ellipse cx="-10" cy="10" rx="5" ry="5" fill="#228B22"/>
      
      <ellipse cx="10" cy="10" rx="8" ry="8" fill="url(#flowerGradient)" filter="url(#elementShadow)"/>
      <ellipse cx="10" cy="10" rx="5" ry="5" fill="#228B22"/>
    </g>
    
    <!-- Tige -->
    <path d="M 0,20 Q 0,40 0,60" fill="none" stroke="#228B22" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Feuilles -->
    <ellipse cx="-8" cy="35" rx="6" ry="3" fill="#32CD32" transform="rotate(-30 -8 35)"/>
    <ellipse cx="8" cy="45" rx="6" ry="3" fill="#32CD32" transform="rotate(30 8 45)"/>
    
    <!-- Réflexion blanche -->
    <circle cx="-3" cy="-3" r="4" fill="rgba(255,255,255,0.4)"/>
  </g>
  
  <!-- Caractère chinois pour la fleur -->
  <text x="50" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#charGradient)" text-anchor="middle" filter="url(#elementShadow)">竹</text>
</svg>