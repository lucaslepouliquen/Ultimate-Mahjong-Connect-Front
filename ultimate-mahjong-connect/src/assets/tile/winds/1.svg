<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le caractère principal -->
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le vent -->
    <linearGradient id="windGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2980b9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f5f8b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Symbole du vent -->
  <g transform="translate(50, 70)">
    <!-- Cercle central -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#windGradient)" stroke-width="5" filter="url(#elementShadow)"/>
    
    <!-- Lignes de vent -->
    <path d="M -30,-20 C -20,-15 -10,-25 0,-20 C 10,-15 20,-25 30,-20" fill="none" stroke="url(#windGradient)" stroke-width="4" stroke-linecap="round" filter="url(#elementShadow)"/>
    <path d="M -30,0 C -20,5 -10,-5 0,0 C 10,5 20,-5 30,0" fill="none" stroke="url(#windGradient)" stroke-width="4" stroke-linecap="round" filter="url(#elementShadow)"/>
    <path d="M -30,20 C -20,25 -10,15 0,20 C 10,25 20,15 30,20" fill="none" stroke="url(#windGradient)" stroke-width="4" stroke-linecap="round" filter="url(#elementShadow)"/>
    
    <!-- Réflexion blanche -->
    <circle cx="-3" cy="-3" r="8" fill="rgba(255,255,255,0.4)"/>
  </g>
  
  <!-- Caractère chinois pour le vent -->
  <text x="50" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#charGradient)" text-anchor="middle" filter="url(#elementShadow)">東</text>
</svg>