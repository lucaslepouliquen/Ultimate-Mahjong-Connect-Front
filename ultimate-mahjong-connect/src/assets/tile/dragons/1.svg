<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le caractère principal -->
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le dragon rouge -->
    <linearGradient id="dragonRedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cc0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Tête de dragon simplifiée -->
  <g transform="translate(50, 70) scale(0.8)">
    <!-- Tête principale -->
    <ellipse cx="0" cy="0" rx="25" ry="20" fill="url(#dragonRedGradient)" stroke="#9d0208" stroke-width="3" filter="url(#elementShadow)"/>
    
    <!-- Yeux -->
    <circle cx="-8" cy="-5" r="4" fill="#000000"/>
    <circle cx="8" cy="-5" r="4" fill="#000000"/>
    <circle cx="-8" cy="-5" r="2" fill="#ffffff"/>
    <circle cx="8" cy="-5" r="2" fill="#ffffff"/>
    
    <!-- Cornes -->
    <path d="M -15,-15 C -20,-25 -25,-30 -30,-25" fill="none" stroke="#9d0208" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15,-15 C 20,-25 25,-30 30,-25" fill="none" stroke="#9d0208" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Moustaches -->
    <path d="M -20,0 C -30,5 -35,10 -40,5" fill="none" stroke="#9d0208" stroke-width="3" stroke-linecap="round"/>
    <path d="M -20,5 C -30,10 -35,15 -40,10" fill="none" stroke="#9d0208" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20,0 C 30,5 35,10 40,5" fill="none" stroke="#9d0208" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20,5 C 30,10 35,15 40,10" fill="none" stroke="#9d0208" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Bouche -->
    <path d="M -10,10 Q 0,15 10,10" fill="none" stroke="#9d0208" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Réflexion blanche -->
    <ellipse cx="-8" cy="-8" rx="8" ry="6" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Caractère chinois pour le dragon -->
  <text x="50" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#charGradient)" text-anchor="middle" filter="url(#elementShadow)">紅</text>
</svg>