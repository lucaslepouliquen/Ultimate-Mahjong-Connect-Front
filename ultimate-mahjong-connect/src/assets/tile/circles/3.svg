<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour les cercles -->
    <radialGradient id="blueCircleGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2e5a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour les caractères -->
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Cercles -->
  <circle cx="30" cy="40" r="12" fill="url(#blueCircleGradient)" filter="url(#elementShadow)"/>
  <circle cx="30" cy="40" r="8.399999999999999" fill="#2196f3"/>
  <circle cx="30" cy="40" r="4.800000000000001" fill="url(#blueCircleGradient)"/>
  <circle cx="27" cy="37" r="3.5999999999999996" fill="rgba(255,255,255,0.4)"/>
  <circle cx="50" cy="70" r="12" fill="url(#blueCircleGradient)" filter="url(#elementShadow)"/>
  <circle cx="50" cy="70" r="8.399999999999999" fill="#2196f3"/>
  <circle cx="50" cy="70" r="4.800000000000001" fill="url(#blueCircleGradient)"/>
  <circle cx="47" cy="67" r="3.5999999999999996" fill="rgba(255,255,255,0.4)"/>
  <circle cx="70" cy="100" r="12" fill="url(#blueCircleGradient)" filter="url(#elementShadow)"/>
  <circle cx="70" cy="100" r="8.399999999999999" fill="#2196f3"/>
  <circle cx="70" cy="100" r="4.800000000000001" fill="url(#blueCircleGradient)"/>
  <circle cx="67" cy="97" r="3.5999999999999996" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Caractère -->
  <text x="50" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', Arial, sans-serif" font-size="16" font-weight="600" fill="url(#charGradient)" filter="url(#elementShadow)" text-anchor="middle">三</text>
</svg>