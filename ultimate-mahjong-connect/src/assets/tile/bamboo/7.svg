<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour les cercles rouges -->
    <radialGradient id="redCircleGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cc0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour les cercles verts -->
    <radialGradient id="greenCircleGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#6bbf6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a7736;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d4d1a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour les cercles bleus -->
    <radialGradient id="blueCircleGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2e5a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour les caractères -->
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le bambou -->
    <linearGradient id="bambooStalk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5a2d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a7736;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a2d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!--  background -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Bamboo icons - top row -->
  <g transform="translate(25, 30)" fill="url(#greenCircleGradient)" filter="url(#elementShadow)">
    <rect x="-4" y="-20" width="8" height="40" rx="4" fill="url(#greenCircleGradient)" filter="url(#elementShadow)"/>
    <rect x="-6" y="-15" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="-5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="15" width="12" height="2" rx="1" fill="#115324"/>
    <path d="M0,-20 C-10,-30 -10,-10 0,-15 C10,-30 10,-10 0,-15" fill="#4caf50"/>
  </g>
  
  <g transform="translate(50, 30)" fill="url(#greenCircleGradient)" filter="url(#elementShadow)">
    <rect x="-4" y="-20" width="8" height="40" rx="4" fill="url(#greenCircleGradient)" filter="url(#elementShadow)"/>
    <rect x="-6" y="-15" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="-5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="15" width="12" height="2" rx="1" fill="#115324"/>
    <path d="M0,-20 C-10,-30 -10,-10 0,-15 C10,-30 10,-10 0,-15" fill="#4caf50"/>
  </g>
  
  <g transform="translate(75, 30)" fill="url(#greenCircleGradient)" filter="url(#elementShadow)">
    <rect x="-4" y="-20" width="8" height="40" rx="4" fill="url(#greenCircleGradient)" filter="url(#elementShadow)"/>
    <rect x="-6" y="-15" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="-5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="15" width="12" height="2" rx="1" fill="#115324"/>
    <path d="M0,-20 C-10,-30 -10,-10 0,-15 C10,-30 10,-10 0,-15" fill="#4caf50"/>
  </g>
  
  <!-- Center bamboo -->
  <g transform="translate(50, 65)" fill="url(#greenCircleGradient)" filter="url(#elementShadow)">
    <rect x="-4" y="-20" width="8" height="40" rx="4" fill="url(#greenCircleGradient)" filter="url(#elementShadow)"/>
    <rect x="-6" y="-15" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="-5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="15" width="12" height="2" rx="1" fill="#115324"/>
    <path d="M0,-20 C-10,-30 -10,-10 0,-15 C10,-30 10,-10 0,-15" fill="#4caf50"/>
  </g>
  
  <!-- Bamboo icons - bottom row -->
  <g transform="translate(25, 100)" fill="url(#greenCircleGradient)" filter="url(#elementShadow)">
    <rect x="-4" y="-20" width="8" height="40" rx="4" fill="url(#greenCircleGradient)" filter="url(#elementShadow)"/>
    <rect x="-6" y="-15" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="-5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="15" width="12" height="2" rx="1" fill="#115324"/>
    <path d="M0,-20 C-10,-30 -10,-10 0,-15 C10,-30 10,-10 0,-15" fill="#4caf50"/>
  </g>
  
  <g transform="translate(50, 100)" fill="url(#greenCircleGradient)" filter="url(#elementShadow)">
    <rect x="-4" y="-20" width="8" height="40" rx="4" fill="url(#greenCircleGradient)" filter="url(#elementShadow)"/>
    <rect x="-6" y="-15" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="-5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="15" width="12" height="2" rx="1" fill="#115324"/>
    <path d="M0,-20 C-10,-30 -10,-10 0,-15 C10,-30 10,-10 0,-15" fill="#4caf50"/>
  </g>
  
  <g transform="translate(75, 100)" fill="url(#greenCircleGradient)" filter="url(#elementShadow)">
    <rect x="-4" y="-20" width="8" height="40" rx="4" fill="url(#greenCircleGradient)" filter="url(#elementShadow)"/>
    <rect x="-6" y="-15" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="-5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="5" width="12" height="2" rx="1" fill="#115324"/>
    <rect x="-6" y="15" width="12" height="2" rx="1" fill="#115324"/>
    <path d="M0,-20 C-10,-30 -10,-10 0,-15 C10,-30 10,-10 0,-15" fill="#4caf50"/>
  </g>
  
  <!-- Character -->
  <text x="50" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', Arial, sans-serif" font-size="16" fill="url(#redCircleGradient)" filter="url(#elementShadow)" text-anchor="middle">七</text>
</svg>
