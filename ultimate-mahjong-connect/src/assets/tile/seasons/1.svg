<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour les fleurs de cerisier -->
    <radialGradient id="cherryGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFB7C5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour les caractères -->
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Symbole du printemps - Arbre de cerisier -->
  <g transform="translate(50, 75)">
    <!-- Tronc et branches -->
    <path d="M 0,30 C 0,20 0,10 0,0
             M 0,0 C -15,-5 -25,-15 -30,-25
             M 0,0 C -5,-10 -5,-20 0,-30
             M 0,0 C 15,-5 25,-15 30,-25"
          fill="none" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Fleurs de cerisier -->
    <g transform="translate(-30, -25)">
      <circle cx="0" cy="0" r="7" fill="url(#cherryGradient)" stroke="#FF69B4" stroke-width="1" filter="url(#elementShadow)"/>
      <circle cx="2" cy="2" r="2" fill="#FFD700"/>
      <circle cx="-3" cy="-3" r="2.8" fill="rgba(255,255,255,0.4)"/>
    </g>
    <g transform="translate(-20, -15)">
      <circle cx="0" cy="0" r="6" fill="url(#cherryGradient)" stroke="#FF69B4" stroke-width="1" filter="url(#elementShadow)"/>
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFD700"/>
      <circle cx="-3" cy="-3" r="2.4" fill="rgba(255,255,255,0.4)"/>
    </g>
    <g transform="translate(-10, -25)">
      <circle cx="0" cy="0" r="5" fill="url(#cherryGradient)" stroke="#FF69B4" stroke-width="1" filter="url(#elementShadow)"/>
      <circle cx="1" cy="1" r="1.5" fill="#FFD700"/>
      <circle cx="-3" cy="-3" r="2" fill="rgba(255,255,255,0.4)"/>
    </g>
    <g transform="translate(0, -30)">
      <circle cx="0" cy="0" r="8" fill="url(#cherryGradient)" stroke="#FF69B4" stroke-width="1" filter="url(#elementShadow)"/>
      <circle cx="2" cy="2" r="2" fill="#FFD700"/>
      <circle cx="-3" cy="-3" r="3.2" fill="rgba(255,255,255,0.4)"/>
    </g>
    <g transform="translate(10, -20)">
      <circle cx="0" cy="0" r="6" fill="url(#cherryGradient)" stroke="#FF69B4" stroke-width="1" filter="url(#elementShadow)"/>
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFD700"/>
      <circle cx="-3" cy="-3" r="2.4" fill="rgba(255,255,255,0.4)"/>
    </g>
    <g transform="translate(25, -25)">
      <circle cx="0" cy="0" r="7" fill="url(#cherryGradient)" stroke="#FF69B4" stroke-width="1" filter="url(#elementShadow)"/>
      <circle cx="2" cy="2" r="2" fill="#FFD700"/>
      <circle cx="-3" cy="-3" r="2.8" fill="rgba(255,255,255,0.4)"/>
    </g>
    
    <!-- Herbe et petites fleurs à la base -->
    <path d="M -25,30 C -20,25 -15,27 -10,30 
             M -5,30 C 0,25 5,27 10,30
             M 15,30 C 20,25 25,27 30,30"
          fill="none" stroke="#228B22" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-22" cy="27" r="2" fill="#FFFF99"/>
    <circle cx="8" cy="27" r="2" fill="#FF99CC"/>
    <circle cx="22" cy="27" r="2" fill="#99CCFF"/>
    <circle cx="5" cy="24" r="0.8" fill="rgba(255,255,255,0.4)"/>
    <circle cx="19" cy="24" r="0.8" fill="rgba(255,255,255,0.4)"/>
  </g>
  
  <!-- Caractère chinois pour le printemps -->
  <text x="50" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', Arial, sans-serif" font-size="16" font-weight="600" fill="url(#charGradient)" text-anchor="middle" filter="url(#elementShadow)">春</text>
</svg>
