<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour la neige -->
    <radialGradient id="snowGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour les caractères -->
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Symbole de l'hiver - Neige et arbre enneigé -->
  <g transform="translate(50, 75)">
    <!-- Arbre enneigé -->
    <path d="M 0,30 C 0,20 0,10 0,0
             M 0,0 C -15,-5 -25,-15 -30,-25
             M 0,0 C -5,-10 -5,-20 0,-30
             M 0,0 C 15,-5 25,-15 30,-25"
          fill="none" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Neige sur les branches -->
    <circle cx="-30" cy="-25" r="3" fill="url(#snowGradient)"/>
    <circle cx="-20" cy="-20" r="2.5" fill="url(#snowGradient)"/>
    <circle cx="-10" cy="-25" r="2" fill="url(#snowGradient)"/>
    <circle cx="0" cy="-30" r="3.5" fill="url(#snowGradient)"/>
    <circle cx="10" cy="-25" r="2" fill="url(#snowGradient)"/>
    <circle cx="20" cy="-20" r="2.5" fill="url(#snowGradient)"/>
    <circle cx="30" cy="-25" r="3" fill="url(#snowGradient)"/>
    
    <!-- Flocons de neige qui tombent -->
    <g transform="translate(-25, 0)">
      <path d="M 0,0 L 1,-1 L 0,-2 L -1,-1 Z" fill="#ffffff"/>
    </g>
    <g transform="translate(-15, 10)">
      <path d="M 0,0 L 1,-1 L 0,-2 L -1,-1 Z" fill="#ffffff"/>
    </g>
    <g transform="translate(-5, 15)">
      <path d="M 0,0 L 1,-1 L 0,-2 L -1,-1 Z" fill="#ffffff"/>
    </g>
    <g transform="translate(10, 5)">
      <path d="M 0,0 L 1,-1 L 0,-2 L -1,-1 Z" fill="#ffffff"/>
    </g>
    <g transform="translate(20, 15)">
      <path d="M 0,0 L 1,-1 L 0,-2 L -1,-1 Z" fill="#ffffff"/>
    </g>
    <g transform="translate(30, 0)">
      <path d="M 0,0 L 1,-1 L 0,-2 L -1,-1 Z" fill="#ffffff"/>
    </g>
    
    <!-- Sol enneigé -->
    <path d="M -40,35 C -35,33 -30,36 -25,34 C -20,32 -15,35 -10,33 
             C -5,31 0,34 5,32 C 10,30 15,33 20,31 C 25,29 30,32 35,30 C 40,28 45,31 50,30
             L 50,40 L -40,40 Z"
          fill="url(#snowGradient)" stroke="#e6f3ff" stroke-width="1"/>
  </g>
  
  <!-- Caractère chinois pour l'hiver -->
  <text x="50" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', Arial, sans-serif" font-size="16" font-weight="600" fill="url(#charGradient)" text-anchor="middle" filter="url(#elementShadow)">冬</text>
</svg>
