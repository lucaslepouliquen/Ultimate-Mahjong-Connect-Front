<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour les feuilles d'automne -->
    <radialGradient id="autumnGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#CD5C5C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour les caractères -->
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Symbole de l'automne - Arbre avec feuilles qui tombent -->
  <g transform="translate(50, 75)">
    <!-- Tronc et branches -->
    <path d="M 0,30 C 0,20 0,10 0,0
             M 0,0 C -15,-5 -25,-15 -30,-25
             M 0,0 C -5,-10 -5,-20 0,-30
             M 0,0 C 15,-5 25,-15 30,-25"
          fill="none" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Feuilles d'automne sur l'arbre -->
    <path d="M -30,-25 L -25,-20 L -30,-15 L -25,-10 L -30,-5"
          fill="none" stroke="#CD5C5C" stroke-width="1" stroke-linecap="round"/>
    <path d="M -20,-20 L -15,-15 L -20,-10 L -15,-5 L -20,0"
          fill="none" stroke="#FFA500" stroke-width="1" stroke-linecap="round"/>
    <path d="M -10,-25 L -5,-20 L -10,-15 L -5,-10 L -10,-5"
          fill="none" stroke="#A0522D" stroke-width="1" stroke-linecap="round"/>
    <path d="M 0,-30 L 5,-25 L 0,-20 L 5,-15 L 0,-10"
          fill="none" stroke="#CD5C5C" stroke-width="1" stroke-linecap="round"/>
    <path d="M 10,-25 L 15,-20 L 10,-15 L 15,-10 L 10,-5"
          fill="none" stroke="#FFA500" stroke-width="1" stroke-linecap="round"/>
    <path d="M 20,-20 L 25,-15 L 20,-10 L 25,-5 L 20,0"
          fill="none" stroke="#A0522D" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Feuilles qui tombent -->
    <g transform="translate(-25, 0)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#CD5C5C"/>
    </g>
    <g transform="translate(-15, 10)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#FFA500"/>
    </g>
    <g transform="translate(-5, 15)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#A0522D"/>
    </g>
    <g transform="translate(10, 5)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#CD5C5C"/>
    </g>
    <g transform="translate(20, 15)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#FFA500"/>
    </g>
    <g transform="translate(30, 0)">
      <path d="M 0,0 C 2,-2 4,0 2,2 C 0,4 -2,2 0,0 Z" fill="#A0522D"/>
    </g>
  </g>
  
  <!-- Caractère chinois pour l'automne -->
  <text x="50" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', Arial, sans-serif" font-size="16" font-weight="600" fill="url(#charGradient)" text-anchor="middle" filter="url(#elementShadow)">秋</text>
</svg>
