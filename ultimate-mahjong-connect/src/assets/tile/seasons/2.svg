<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <!-- Dégradé pour le fond de la tuile -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le soleil -->
    <radialGradient id="sunGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dégradé pour l'océan -->
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour les caractères -->
    <linearGradient id="charGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Filtre d'ombre pour la tuile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fond de la tuile avec dégradé et ombre -->
  <rect width="100" height="140" rx="8" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#tileShadow)"/>
  
  <!-- Symbole de l'été - Soleil et plage -->
  <g transform="translate(50, 70)">
    <!-- Soleil -->
    <circle cx="0" cy="-20" r="15" fill="url(#sunGradient)" stroke="#FF8C00" stroke-width="2" filter="url(#elementShadow)"/>
    <path d="M 0,-40 V -45 M 15,-35 L 18,-40 M 25,-20 L 30,-22 M 15,-5 L 18,0 
             M 0,0 V 5 M -15,-5 L -18,0 M -25,-20 L -30,-22 M -15,-35 L -18,-40"
          fill="none" stroke="#FF8C00" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Vagues de l'océan -->
    <path d="M -40,30 C -30,25 -20,35 -10,30 C 0,25 10,35 20,30 C 30,25 40,35 50,30"
          fill="none" stroke="url(#oceanGradient)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -40,20 C -30,15 -20,25 -10,20 C 0,15 10,25 20,20 C 30,15 40,25 50,20"
          fill="none" stroke="url(#oceanGradient)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Sable de la plage -->
    <path d="M -40,35 C -35,33 -30,36 -25,34 C -20,32 -15,35 -10,33 
             C -5,31 0,34 5,32 C 10,30 15,33 20,31 C 25,29 30,32 35,30 C 40,28 45,31 50,30
             L 50,40 L -40,40 Z"
          fill="#F5DEB3" stroke="#DEB887" stroke-width="1"/>
    
    <!-- Palmier -->
    <path d="M -20,30 C -20,25 -20,20 -20,15 C -18,10 -16,5 -20,0"
          fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
    <path d="M -20,0 C -25,-5 -30,-5 -35,-10 M -20,0 C -15,-5 -15,-10 -15,-15 M -20,0 C -25,0 -30,5 -35,0"
          fill="none" stroke="#228B22" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Parasol de plage -->
    <path d="M 25,30 V 10"
          fill="none" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
    <path d="M 25,10 L 10,20 L 40,20 Z"
          fill="#FF6347" stroke="#FF4500" stroke-width="1"/>
  </g>
  
  <!-- Caractère chinois pour l'été -->
  <text x="50" y="120" font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', Arial, sans-serif" font-size="16" font-weight="600" fill="url(#charGradient)" text-anchor="middle" filter="url(#elementShadow)">夏</text>
</svg>
