apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultimate-mahjong-connect-front
  namespace: ultimate-mahjong-connect
  labels:
    app: ultimate-mahjong-connect-front
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ultimate-mahjong-connect-front
  template:
    metadata:
      labels:
        app: ultimate-mahjong-connect-front
    spec:
      containers:
      - name: ultimate-mahjong-connect-front
        image: ghcr.io/lucaslepouliquen/ultimate-mahjong-connect-front-image:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: API_URL
          value: "http://ultimate-mahjong-connect:8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ultimate-mahjong-connect-front-service
  namespace: ultimate-mahjong-connect
  labels:
    app: ultimate-mahjong-connect-front
spec:
  selector:
    app: ultimate-mahjong-connect-front
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ultimate-mahjong-connect-front-ingress
  namespace: ultimate-mahjong-connect
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: mahjong-connect.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ultimate-mahjong-connect-front-service
            port:
              number: 80 